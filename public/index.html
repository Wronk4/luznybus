<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#13212E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LuźnyBus</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="device">
    <div class="phone" id="phone">
      <div class="statusbar"><span id="sb-time">--:--</span><span class="sb-icons"><i></i><i></i><i></i></span></div>
      <div id="map" class="map"></div>

      <header class="topbar">
        <div class="brand"><img src="/icon.svg" alt="" /><span>Luźny<b>Bus</b></span></div>
        <button class="chip live" id="live-chip" title="Dane na żywo"><span class="dot"></span><span id="clock">--:--</span></button>
      </header>

      <div class="map-fabs">
        <button class="fab" id="btn-locate" aria-label="Moja lokalizacja">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" fill="none"/></svg>
        </button>
        <button class="fab" id="btn-vehicles" aria-label="Pokaż/ukryj pojazdy" aria-pressed="true">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8 21l1.5-3M16 21l-1.5-3"/><circle cx="8.5" cy="14.5" r="1"/><circle cx="15.5" cy="14.5" r="1"/></svg>
        </button>
      </div>

      <section class="sheet" id="sheet" data-state="half">
        <div class="sheet-grip" id="sheet-grip"><span></span></div>
        <div class="sheet-head" id="sheet-head"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </section>

      <nav class="tabbar" id="tabbar">
        <button data-tab="route" class="active"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg><span>Trasa</span></button>
        <button data-tab="stops"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Odjazdy</span></button>
      </nav>

      <div class="modal" id="modal" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <aside class="device-caption">
      <img src="/icon.svg" alt="" />
      <h1>LuźnyBus</h1>
      <p>Nie wsiadaj do pierwszego. Wsiądź do luźnego.</p>
      <p class="muted">Otwórz na telefonie i dodaj do ekranu głównego, żeby działało jak aplikacja.</p>
    </aside>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
